<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Codex Remote Control</title><link rel="stylesheet" href="/styles.css?v=14"></head>
<body><main class="shell"><header><div><p class="eyebrow">CODEX REMOTE CONTROL</p><h1>远程任务中心</h1><p class="sub">实时进度、完整事件流与安全授权</p></div><div class="connection-block"><div class="connection" role="status"><span id="dot"></span><span id="connectionText">未连接</span></div><small id="accountBalance" class="account-balance">余额：连接后读取</small></div></header>
<section class="toolbar"><label>访问令牌<input id="token" type="password" placeholder="粘贴服务端 token"></label><button id="connect">连接</button></section>
<section class="presence-toolbar"><label><input type="checkbox" id="phoneApproval">此设备接收手机审批</label><span id="mobilePresenceText">手机离线，请求保留，可用电脑 CRC 审批</span><span class="presence-help">锁屏或离线时保留请求；回到页面后可继续审批</span></section>
<section class="workspace"><aside class="panel conversations-panel"><div class="panel-head"><div><span class="kicker">CODEX 对话</span><h2>项目树</h2><small id="catalogText" class="catalog-note">连接后同步桌面对话目录</small></div><span id="conversationCount" class="count">0</span></div><button id="syncConversations" class="secondary sync-button">刷新对话列表</button><div id="conversationList" class="conversation-list"><div class="empty">连接后加载对话</div></div><div class="legend"><span><i class="state-dot running"></i>运行中</span><span><i class="state-dot waiting"></i>待处理</span><span><i class="state-dot done"></i>本轮结束</span></div></aside><div class="main-column"><div class="panel focus"><div class="panel-head"><div><span class="kicker">当前对话</span><h2 id="taskTitle">等待任务</h2><small id="taskConversation" class="conversation-id"></small></div><span id="taskStatus" class="status idle">空闲</span></div><div class="progress idle" id="progressTrack" role="progressbar" aria-label="当前任务进度" aria-valuemin="0" aria-valuemax="100" aria-valuetext="暂无进度"><div id="bar"></div></div><div class="task-meta"><span id="progressPhase">等待任务事件</span><span id="progressText">暂无进度</span></div><p id="progressNote" class="progress-note">收到实时任务事件后显示进度</p><ol id="planSteps" class="plan-steps" hidden></ol><p id="taskMessage" class="task-message">尚未收到任务事件</p><p id="taskError" class="task-error" role="status" hidden></p></div><div class="panel"><div class="panel-head"><div><span class="kicker">需要你决定</span><h2>授权与提问</h2></div><span id="pendingCount" class="count">0</span></div><div id="requests" class="requests"><div class="empty">没有待处理请求</div></div></div></div></section>
<section class="panel events"><div class="panel-head"><div><span class="kicker">不可丢失的记录</span><h2>事件流</h2></div><button class="icon-btn" id="clear" title="清空视图">清空视图</button></div><div id="eventList" class="event-list"></div></section>
</main><script type="module" src="/app-v2.js?v=16"></script></body></html>
